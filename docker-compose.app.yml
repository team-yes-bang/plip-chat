# App 전용 설정. Develop 통합 환경 및 로컬에서 docker-compose 실행 시 이 파일을 include 해 사용합니다.

services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plip-service-chat
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8082}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/plip_chat?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: chat
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    networks:
      - plip-net

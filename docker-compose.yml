# 로컬에서 도커로 개발할 때 사용하는 파일입니다.
# 순수 서비스 전용 docker-compose.app.yml 파일을 include 합니다.

include:
  - docker-compose.app.yml

networks:
  plip-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.4
    container_name: plip-chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plip_chat}
    ports:
      - "3308:3306"
    volumes:
      - plip_chat_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - plip-net

  # 로컬에서 앱까지 Docker로 실행할 때 Eureka 의존이 필요 없으면 아래 주석을 해제하세요.
  # chat:
  #   depends_on: !reset
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     EUREKA_CLIENT_ENABLED: "false"
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"

volumes:
  plip_chat_mysql_data:

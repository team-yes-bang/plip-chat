# 로컬에서 도커로 개발할 때 사용하는 파일입니다.
# 순수 서비스 전용 docker-compose.app.yml 파일을 include 합니다.

include:
  - docker-compose.app.yml

networks:
  plip-net:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: plip-chat-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - plip-net

  redis:
    image: redis:7-alpine
    container_name: plip-chat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - plip-net

  # Common Mongo replica set spec (copy to plip-develop-env: same image/command/replSet/URI host `mongo`).
  # container_name: chat local `plip-chat-mongo`; develop-env copy uses `plip-mongo`.
  mongo:
    image: mongo:7
    container_name: plip-chat-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - plip_chat_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - plip-net

  mongo-init:
    image: mongo:7
    container_name: plip-chat-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '
    networks:
      - plip-net

  # 로컬에서 앱까지 Docker로 실행할 때 Eureka 의존이 필요 없으면 아래 주석을 해제하세요.
  # chat:
  #   depends_on: !reset
  #     kafka:
  #       condition: service_started
  #     redis:
  #       condition: service_healthy
  #     mongo:
  #       condition: service_healthy
  #     mongo-init:
  #       condition: service_completed_successfully
  #   environment:
  #     EUREKA_CLIENT_ENABLED: "false"
  #   ports:
  #     - "${SERVER_PORT:-8080}:8080"

volumes:
  plip_chat_mongo_data:

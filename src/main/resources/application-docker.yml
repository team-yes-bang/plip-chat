server:
  port: ${SERVER_PORT:8080}

eureka:
  instance:
    # plip-net Compose DNS — Gateway 컨테이너에서 chat:8080 으로 접근
    hostname: chat
    prefer-ip-address: false
    instance-id: ${spring.application.name}:docker:${server.port}
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

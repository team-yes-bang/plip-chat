spring:
  application:
    name: chat # Eureka 등록명 — 소문자·하이픈 (Gateway lb://chat 과 동일)
  profiles:
    active: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: chat-agit-read-model
      auto-offset-reset: earliest
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/plip_chat?replicaSet=rs0}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    enabled: true # 공통(dev 등) 기본 연동. local/docker 프로필에서 false
    register-with-eureka: true
    fetch-registry: true
